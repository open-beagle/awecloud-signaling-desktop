name: Build and Release Desktop

on:
  push:
    branches:
      - release-v1.0

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-version:
    name: Read Version
    runs-on: ubuntu-latest
    outputs:
      BUILD_VERSION: ${{ steps.version.outputs.BUILD_VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from file
        id: version
        run: echo "BUILD_VERSION=$(cat version | tr -d '\n\r')" >> $GITHUB_OUTPUT

  build-desktop:
    name: Build Desktop (Linux/Windows)
    runs-on: ubuntu-latest
    needs: read-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libsoup-3.0-dev \
            pkg-config \
            nsis \
            unzip

      - name: Create Desktop environment
        env:
          SIGNALING_ADDRESS: https://signal.wodcloud.com
        run: |
          umask 077
          printf 'SIGNALING_ADDRESS=%s\n' "$SIGNALING_ADDRESS" > .env

      - name: Build Desktop Applications (Linux and Windows)
        run: |
          PLATFORMS=linux/amd64,windows/amd64 \
          RELEASE_ARTIFACTS=true \
          BUILD_VERSION=${{ needs.read-version.outputs.BUILD_VERSION }} \
          bash ./scripts/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-all-platforms
          path: build/bin/*
          retention-days: 1

      - name: Remove Desktop environment
        if: always()
        run: rm -f .env

  build-desktop-mac:
    name: Build Desktop (macOS)
    runs-on: macos-latest
    needs: read-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Desktop environment
        env:
          SIGNALING_ADDRESS: https://signal.wodcloud.com
        run: |
          umask 077
          printf 'SIGNALING_ADDRESS=%s\n' "$SIGNALING_ADDRESS" > .env

      - name: Build Desktop Application (macOS)
        run: |
          PLATFORMS=darwin/arm64,darwin/amd64 \
          RELEASE_ARTIFACTS=true \
          BUILD_VERSION=${{ needs.read-version.outputs.BUILD_VERSION }} \
          bash ./scripts/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: build/bin/*
          retention-days: 1

      - name: Remove Desktop environment
        if: always()
        run: rm -f .env

  upload-to-s3:
    name: Upload to S3
    runs-on: ubuntu-latest
    needs: [read-version, build-desktop, build-desktop-mac]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Linux/Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-all-platforms
          path: artifacts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos
          path: artifacts

      - name: Package release
        env:
          RELEASE_PACKAGE_ONLY: "true"
          BUILD_VERSION: ${{ needs.read-version.outputs.BUILD_VERSION }}
          ARTIFACT_BASE_URL: https://cache.ali.wodcloud.com/vscode/awecloud-signaling
        run: bash ./scripts/build.sh

      - name: Setup MinIO Client
        run: |
          curl -fsSLo mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          sudo mv mc /usr/local/bin/

      - name: Publish artifacts
        env:
          S3_ENDPOINT_ALIYUN: ${{ secrets.S3_ENDPOINT_ALIYUN }}
          S3_ACCESS_KEY_ALIYUN: ${{ secrets.S3_ACCESS_KEY_ALIYUN }}
          S3_SECRET_KEY_ALIYUN: ${{ secrets.S3_SECRET_KEY_ALIYUN }}
        run: |
          set -euo pipefail
          mc alias set aliyun --api=S3v4 "${S3_ENDPOINT_ALIYUN}" "${S3_ACCESS_KEY_ALIYUN}" "${S3_SECRET_KEY_ALIYUN}"
          mc mirror --overwrite build/publish/ aliyun/vscode/awecloud-signaling/

      - name: Publish summary
        env:
          VERSION: ${{ needs.read-version.outputs.BUILD_VERSION }}
        run: |
          {
            echo "### Desktop release"
            echo "- Version: \`${VERSION}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Manifest: \`updater/releases/desktop/latest.json\`"
            echo "- Artifacts: 8 (App + Launcher)"
            echo "- Server registration: use Platform > System Configuration > Sync artifacts and versions"
          } >> "${GITHUB_STEP_SUMMARY}"
