name: Build and Release Desktop

on:
  push:
    branches:
      - release-v1.0
  workflow_dispatch: # 允许手动触发

jobs:
  read-version:
    name: Read Version
    runs-on: ubuntu-latest
    outputs:
      BUILD_VERSION: ${{ steps.version.outputs.BUILD_VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from file
        id: version
        run: echo "BUILD_VERSION=$(cat version | tr -d '\n\r')" >> $GITHUB_OUTPUT

  build-desktop:
    name: Build Desktop (Linux/Windows)
    runs-on: ubuntu-latest
    needs: read-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libsoup-3.0-dev \
            pkg-config \
            nsis \
            unzip

      - name: Create Desktop environment
        env:
          SIGNALING_ADDRESS: ${{ secrets.SIGNALING_ADDRESS }}
        run: |
          if [ -z "$SIGNALING_ADDRESS" ]; then
            echo "SIGNALING_ADDRESS secret is required" >&2
            exit 1
          fi
          umask 077
          printf 'SIGNALING_ADDRESS=%s\n' "$SIGNALING_ADDRESS" > .env

      - name: Build Desktop Applications (Linux and Windows)
        run: |
          PLATFORMS=linux/amd64,windows/amd64 \
          RELEASE_ARTIFACTS=true \
          BUILD_VERSION=${{ needs.read-version.outputs.BUILD_VERSION }} \
          bash ./scripts/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-all-platforms
          path: build/bin/*
          retention-days: 1

      - name: Remove Desktop environment
        if: always()
        run: rm -f .env

  build-desktop-mac:
    name: Build Desktop (macOS)
    runs-on: macos-latest
    needs: read-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Desktop environment
        env:
          SIGNALING_ADDRESS: ${{ secrets.SIGNALING_ADDRESS }}
        run: |
          if [ -z "$SIGNALING_ADDRESS" ]; then
            echo "SIGNALING_ADDRESS secret is required" >&2
            exit 1
          fi
          umask 077
          printf 'SIGNALING_ADDRESS=%s\n' "$SIGNALING_ADDRESS" > .env

      - name: Build Desktop Application (macOS)
        run: |
          PLATFORMS=darwin/arm64,darwin/amd64 \
          RELEASE_ARTIFACTS=true \
          BUILD_VERSION=${{ needs.read-version.outputs.BUILD_VERSION }} \
          bash ./scripts/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: build/bin/*
          retention-days: 1

      - name: Remove Desktop environment
        if: always()
        run: rm -f .env

  upload-to-s3:
    name: Upload to S3
    runs-on: ubuntu-latest
    needs: [read-version, build-desktop, build-desktop-mac]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Linux/Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-all-platforms
          path: artifacts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos
          path: artifacts

      - name: Setup MinIO Client
        run: |
          curl -fsSLo mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          sudo mv mc /usr/local/bin/

      - name: Publish Desktop artifacts and release manifest
        env:
          S3_ENDPOINT_ALIYUN: ${{ secrets.S3_ENDPOINT_ALIYUN }}
          S3_ACCESS_KEY_ALIYUN: ${{ secrets.S3_ACCESS_KEY_ALIYUN }}
          S3_SECRET_KEY_ALIYUN: ${{ secrets.S3_SECRET_KEY_ALIYUN }}
          VERSION: ${{ needs.read-version.outputs.BUILD_VERSION }}
          ARTIFACT_BASE_URL: https://cache.ali.wodcloud.com/vscode/awecloud-signaling
        run: |
          set -euo pipefail
          mc alias set aliyun --api=S3v4 "${S3_ENDPOINT_ALIYUN}" "${S3_ACCESS_KEY_ALIYUN}" "${S3_SECRET_KEY_ALIYUN}"

          s3_bucket="aliyun/vscode/awecloud-signaling"
          published_at="$(date -u -d "@$(git show -s --format=%ct HEAD)" +%Y-%m-%dT%H:%M:%SZ)"

          upload_immutable() {
            local source="$1" target="$2" expected_sha="$3"
            if mc stat "${target}" >/dev/null 2>&1; then
              mc cp "${target}" existing-artifact
              existing_sha="$(sha256sum existing-artifact | awk '{print $1}')"
              rm -f existing-artifact
              test "${existing_sha}" = "${expected_sha}" || {
                echo "Immutable artifact conflict: ${target}" >&2
                exit 1
              }
              return
            fi
            mc cp "${source}" "${target}"
            mc cp "${target}" uploaded-artifact
            uploaded_sha="$(sha256sum uploaded-artifact | awk '{print $1}')"
            rm -f uploaded-artifact
            test "${uploaded_sha}" = "${expected_sha}" || {
              echo "Uploaded artifact verification failed: ${target}" >&2
              exit 1
            }
          }

          artifact_specs=(
            "windows|amd64|app|binary|signal_desktop-${VERSION}-windows-amd64.exe"
            "windows|amd64|launcher|binary|beagle-signal.launcher-${VERSION}-windows-amd64.exe"
            "darwin|arm64|app|zip|signal_desktop-${VERSION}-darwin-arm64.zip"
            "darwin|arm64|launcher|binary|beagle-signal.launcher-${VERSION}-darwin-arm64"
            "darwin|amd64|app|zip|signal_desktop-${VERSION}-darwin-amd64.zip"
            "darwin|amd64|launcher|binary|beagle-signal.launcher-${VERSION}-darwin-amd64"
            "linux|amd64|app|binary|signal_desktop-${VERSION}-linux-amd64"
            "linux|amd64|launcher|binary|beagle-signal.launcher-${VERSION}-linux-amd64"
          )

          artifacts_json='[]'
          for spec in "${artifact_specs[@]}"; do
            IFS='|' read -r os arch role package_type filename <<< "${spec}"
            source="artifacts/${filename}"
            test -f "${source}" || { echo "Missing Desktop artifact: ${filename}" >&2; exit 1; }
            sha256="$(sha256sum "${source}" | awk '{print $1}')"
            size="$(stat -c %s "${source}")"
            object="${s3_bucket}/desktop/artifacts/${os}/${arch}/${role}/${sha256}/${filename}"
            download_url="${ARTIFACT_BASE_URL}/desktop/artifacts/${os}/${arch}/${role}/${sha256}/${filename}"
            upload_immutable "${source}" "${object}" "${sha256}"
            artifacts_json="$(jq -c \
              --arg os "${os}" --arg arch "${arch}" --arg role "${role}" \
              --arg package_type "${package_type}" --arg filename "${filename}" \
              --arg download_url "${download_url}" --arg sha256 "${sha256}" --argjson size "${size}" \
              '. + [{os: $os, arch: $arch, role: $role, package_type: $package_type,
                      filename: $filename, download_url: $download_url, size: $size, sha256: $sha256}]' \
              <<< "${artifacts_json}")"
          done

          jq -n \
            --arg published_at "${published_at}" --arg version "${VERSION}" --arg commit "${GITHUB_SHA}" \
            --argjson artifacts "${artifacts_json}" \
            '{schema_version: 1, published_at: $published_at, release: {
              component: "desktop", version: $version, commit_id: $commit, channel: "stable",
              release_notes: ("Desktop build " + $commit), min_supported_version: ""
            }, artifacts: $artifacts}' > desktop-release.json
          jq -e '.schema_version == 1 and .release.component == "desktop" and (.artifacts | length == 8)' desktop-release.json >/dev/null

          release_sha="$(sha256sum desktop-release.json | awk '{print $1}')"
          release_object="${s3_bucket}/updater/releases/desktop/${GITHUB_SHA}.json"
          release_url="${ARTIFACT_BASE_URL}/updater/releases/desktop/${GITHUB_SHA}.json"
          upload_immutable desktop-release.json "${release_object}" "${release_sha}"

          catalog_object="${s3_bucket}/updater/catalog.json"
          list_manifest_urls() {
            mc find "${s3_bucket}/updater/releases" --name '*.json' \
              | sed -n "s#^${s3_bucket}/updater/releases/#${ARTIFACT_BASE_URL}/updater/releases/#p" \
              | jq -Rsc 'split("\n") | map(select(length > 0)) | sort | unique'
          }
          publish_catalog() {
            local attempt expected actual
            for attempt in 1 2 3 4 5; do
              expected="$(list_manifest_urls)"
              jq -n --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson manifests "${expected}" \
                '{schema_version: 1, generated_at: $generated_at, manifests: $manifests}' > updater-catalog.json
              mc cp updater-catalog.json "${catalog_object}"

              # S3 listings are the source of truth. Recheck after the write so
              # concurrent component pipelines cannot silently drop a commit.
              expected="$(list_manifest_urls)"
              actual="$(mc cat "${catalog_object}" | jq -c '.manifests | sort | unique')"
              if [ "${actual}" = "${expected}" ]; then
                return 0
              fi
              sleep "${attempt}"
            done
            echo "Updater catalog changed concurrently after 5 attempts" >&2
            return 1
          }
          publish_catalog
          mc cat "${catalog_object}" | jq -e --arg release_url "${release_url}" \
            '.schema_version == 1 and (.manifests | index($release_url)) != null' >/dev/null

          {
            echo "### Desktop release"
            echo "- Version: \`${VERSION}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Manifest: \`updater/releases/desktop/${GITHUB_SHA}.json\`"
            echo "- Artifacts: 8 (App + Launcher)"
            echo "- Server registration: use Platform > System Configuration > Sync artifacts and versions"
          } >> "${GITHUB_STEP_SUMMARY}"
